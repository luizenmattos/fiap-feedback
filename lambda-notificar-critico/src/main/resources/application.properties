quarkus.lambda.handler=notificarItemCritico
sqs.queue.url=${SQS_QUEUE_URL}

quarkus.index-dependency.infra-sqs.group-id=br.com.luizen
quarkus.index-dependency.infra-sqs.artifact-id=infra-sqs

# Email destinatário das notificações de item crítico
email.destinatario=${EMAIL_DESTINATARIO}

# Configurações SMTP — credenciais via variáveis de ambiente
quarkus.mailer.from=${SMTP_REMETENTE}
quarkus.mailer.host=${SMTP_HOST}
quarkus.mailer.port=${SMTP_PORT}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${SMTP_USUARIO}
quarkus.mailer.password=${SMTP_SENHA}

# Desenvolvimento local — usa servidor mock (não envia email de verdade)
%dev.quarkus.mailer.mock=true
