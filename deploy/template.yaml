AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: fiap-feedback — stack completo

# ─────────────────────────────────────────────────────────────────────────────
# Parâmetros
# ─────────────────────────────────────────────────────────────────────────────
Parameters:

  # Recursos existentes na AWS (não gerenciados pelo SAM)
  DynamoTableName:
    Type: String
    Default: "feedbacks"
    Description: Nome da tabela DynamoDB já existente

  SqsQueueUrl:
    Type: String
    Description: URL completa da fila SQS já existente

  SqsQueueName:
    Type: String
    Default: "feedback-post"
    Description: Nome da fila SQS já existente (usado nas policies)

  # Configurações SMTP
  SmtpHost:
    Type: String
    Description: Endereço do servidor SMTP

  SmtpPort:
    Type: String
    Default: "587"

  SmtpUsuario:
    Type: String
    Description: Usuário de autenticação SMTP

  SmtpSenha:
    Type: String
    Description: Senha do SMTP
    NoEcho: true

  SmtpRemetente:
    Type: String
    Default: noreply@empresa.com

  EmailDestinatario:
    Type: String
    Description: E-mail que receberá os alertas de avaliação crítica

# ─────────────────────────────────────────────────────────────────────────────
# Defaults aplicados a todas as funções Lambda
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 30
    Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest

# ─────────────────────────────────────────────────────────────────────────────
# Recursos — apenas Lambdas e API Gateway
# DynamoDB e SQS já existem na AWS e são referenciados via parâmetros
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── API Gateway ───────────────────────────────────────────────────────────

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: "fiap-feedback-api"
      StageName: v1
      EndpointConfiguration:
        Type: REGIONAL

  # ── lambda-postar-feedback ────────────────────────────────────────────────

  LambdaPostarFeedback:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "postar-feedback"
      CodeUri: ../lambda-postar-feedback/target/function.zip
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoTableName
        - SQSSendMessagePolicy:
            QueueName: !Ref SqsQueueName
      Environment:
        Variables:
          DYNAMODB_TABLE_FEEDBACKS: !Ref DynamoTableName
          SQS_QUEUE_URL: !Ref SqsQueueUrl
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /feedback
            Method: POST

  # ── lambda-gerar-relatorio ────────────────────────────────────────────────

  LambdaGerarRelatorio:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "enviar-relatorio-feedbacks"
      CodeUri: ../lambda-gerar-relatorio/target/function.zip
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoTableName
      Environment:
        Variables:
          DYNAMODB_TABLE_FEEDBACKS: !Ref DynamoTableName
      Events:
        ApiGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /relatorio
            Method: GET

  # ── lambda-notificar-critico ──────────────────────────────────────────────

  LambdaNotificarCritico:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "notificar-feedback-critico"
      CodeUri: ../lambda-notificar-critico/target/function.zip
      Timeout: 60
      Policies:
        - SQSPollerPolicy:
            QueueName: !Ref SqsQueueName
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref SqsQueueUrl
          EMAIL_DESTINATARIO: !Ref EmailDestinatario
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_USUARIO: !Ref SmtpUsuario
          SMTP_SENHA: !Ref SmtpSenha
          SMTP_REMETENTE: !Ref SmtpRemetente
      Events:
        AgendamentoPolling:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: Invoca a Lambda para consumir mensagens críticas da fila SQS
            Enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  UrlApiGateway:
    Description: URL base da API Gateway
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/v1"

  ArnLambdaPostarFeedback:
    Description: ARN da função postar-feedback
    Value: !GetAtt LambdaPostarFeedback.Arn

  ArnLambdaGerarRelatorio:
    Description: ARN da função enviar-relatorio-feedbacks
    Value: !GetAtt LambdaGerarRelatorio.Arn

  ArnLambdaNotificarCritico:
    Description: ARN da função notificar-feedback-critico
    Value: !GetAtt LambdaNotificarCritico.Arn